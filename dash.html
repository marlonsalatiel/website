<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>ZapLution — Dashboard</title>
  <style>
    :root{
      --bg:#0b0f0c;--card:#111614;--muted:#a0afa8;--text:#e8f2ee;--line:#1d2622;
      --wa:#25d366;--wa-dark:#128c7e;--danger:#ef4444;--ok:#22c55e;--warn:#f59e0b;
      --shadow:0 10px 30px rgba(0,0,0,.5);
    }
    *{box-sizing:border-box}html,body{height:100%}
    body{margin:0;font-family:ui-sans-serif,system-ui; background:var(--bg); color:var(--text);}
    .wrap{max-width:1100px;margin:0 auto;padding:clamp(16px,3vw,28px)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:32px;height:32px;border-radius:10px;background:
      conic-gradient(from 180deg at 50% 50%, var(--wa) 0 25%, var(--wa-dark) 25% 50%, #1f8f64 50% 75%, #1a7b56 75% 100%);
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),var(--shadow)}
    .brand h1{margin:0;font-size:16px;font-weight:600}
    .pill{border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:999px;font-size:12px}
    .actions{display:flex;align-items:center;gap:8px}
    .btn{display:inline-grid;place-items:center;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
      background:#0f1512;color:var(--text);cursor:pointer;font-size:13px}
    .btn.primary{border:0;background:linear-gradient(180deg, var(--wa), var(--wa-dark));color:#05231a}
    .btn.danger{background:var(--danger);color:#fff;border:0}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
    .card{grid-column:span 12;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
    .inst-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);
      border-radius:12px;background:#0e1411}
    .inst-meta{display:flex;align-items:center;gap:12px;min-width:0}
    .avatar{width:32px;height:32px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
    .dot{width:10px;height:10px;border-radius:999px}
    .name{font-weight:700}
    .sub{font-size:12px;color:var(--muted)}
    .row-actions{display:flex;gap:8px}
    .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:999px}
    .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0f1512;border:1px solid var(--line);padding:10px 14px;
      border-radius:12px;color:var(--text);display:none}
    .toast.show{display:block}
  </style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="logo"></div><h1>ZapLution</h1>
      <div id="usage" class="pill">Inicializando…</div>
    </div>
    <div class="actions">
      <button id="reloadBtn" class="btn">Recarregar</button>
      <button id="newBtn" class="btn primary">Nova Conexão</button>
      <button id="logoutBtn" class="btn">Sair</button>
    </div>
  </header>

  <main class="grid">
    <section class="card sm-6 md-4">
      <h3>Instâncias</h3>
      <div id="list"></div>
    </section>
    <section class="card sm-6 md-4">
      <h3>Resumo</h3>
      <div class="tag" id="loginTag">Usuário: —</div>
      <div class="tag" id="minsTotalTag">Minutos Transcritos (Total): —</div>
      <div class="tag" id="minsMonthTag">Minutos Transcritos (Esse mês): —</div>
    </section>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
(function(){
  const CONNECT_WEBHOOK    = 'https://n8n.msalatiel.com.br/webhook/connectInstance';
  const DISCONNECT_WEBHOOK = 'https://n8n.msalatiel.com.br/webhook/disconnectInstance';
  const DELETE_WEBHOOK     = 'https://n8n.msalatiel.com.br/webhook/deleteInstance';
  const LOAD_INFO_WEBHOOK  = 'https://n8n.msalatiel.com.br/webhook/loadinfo';

  const listEl = document.getElementById('list');
  const loginTag = document.getElementById('loginTag');
  const minsTotalTag = document.getElementById('minsTotalTag');
  const minsMonthTag = document.getElementById('minsMonthTag');
  const usageEl = document.getElementById('usage');
  const toastEl = document.getElementById('toast');

  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),2000); }
  function maskPhone(jid){const d=(jid||'').split('@')[0];return d?`+${d.slice(0,2)} ${d.slice(2,4)} ${d.slice(4,5)} ${d.slice(5,9)}-${d.slice(9,13)}`:'—';}
  function statusColor(st){return st==='open'?'var(--ok)':'var(--danger)';}

  function instanceCard(info){
    const name = info?.name||'—';
    const phone = maskPhone(info?.ownerJid);
    const connected = (info?.connectionStatus||'').toLowerCase()==='open';
    let actions = '';
    if(connected){
      actions = `<button class="btn danger" data-act="disconnect" data-name="${name}">Desconectar</button>`;
    }else{
      actions = `<button class="btn primary" data-act="connect" data-name="${name}">Conectar</button>
                 <button class="btn danger" data-act="delete" data-name="${name}">Deletar</button>`;
    }
    return `<div class="inst-item">
      <div class="inst-meta">
        <img class="avatar" src="${info?.profilePicUrl||''}" onerror="this.style.display='none'">
        <span class="dot" style="background:${statusColor(info?.connectionStatus)}"></span>
        <div><div class="name">${name}</div><div class="sub">${phone}</div></div>
      </div>
      <div class="row-actions">${actions}</div>
    </div>`;
  }

  async function actionWebhook(type,name){
    const url = type==='disconnect'?DISCONNECT_WEBHOOK:type==='connect'?CONNECT_WEBHOOK:DELETE_WEBHOOK;
    try{
      await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:name});
      toast(`${type} enviado`);
    }catch{toast(`${type} falhou`);}
  }

  async function fetchLoadInfo(){
    try{
      const res=await fetch(LOAD_INFO_WEBHOOK,{method:'POST'});
      const arr=await res.json();
      listEl.innerHTML='';
      arr.forEach(it=>{
        const info = it.results?.[0]?.data?.[0] || it.data?.[0];
        if(info) listEl.innerHTML+=instanceCard(info);
      });
      wireActions();
    }catch(e){toast('Erro loadinfo');}
  }

  function wireActions(){
    listEl.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click',()=>actionWebhook(btn.dataset.act,btn.dataset.name));
    });
  }

  // Boot
  loginTag.textContent='Usuário: marlon'; // ou do authData
  minsTotalTag.textContent='Minutos Transcritos (Total): 1234';
  minsMonthTag.textContent='Minutos Transcritos (Esse mês): 56';
  fetchLoadInfo();
})();
</script>
</body>
</html>
